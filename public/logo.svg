<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="300" height="130" role="img" aria-label="Concurrent Crocodiles">
  <title>Concurrent Crocodiles</title>
  <!-- One node, forking into two crocodiles that run at once: the smallest
       instance of the board itself. The mark alone lives in components/Logo.tsx
       and, simplified for 16px, in app/icon.svg.

       The box has to hold the crocodiles' corners rather than their upright
       height, because they are rotated: at this scale each one reaches about
       36 units above and below its own midline, and that is what sets the 130.
       Measure before changing the scale or the spread.

       The wordmark defaults to a mid green that carries on a light page and on
       the swamp-dark one, and goes lighter where the viewer's dark mode is
       readable — some renderers strip this <style>, which is why the default
       has to stand on its own. -->
  <style>
    .word { fill: #4e8a3c; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #86c46a; }
    }
  </style>

  <g stroke="#2f8d7d" stroke-width="6" fill="none" stroke-linecap="round"
     stroke-dasharray="0.1 8.5">
    <path d="M14 65 C28 65 25 43 36 41" />
    <path d="M14 65 C28 65 25 87 36 89" />
  </g>
  <circle cx="12" cy="65" r="9.5" fill="#2f8d7d" />

  <g transform="translate(34 40) rotate(-15) scale(2.95)">
    <path d="M13.5 -3.6 h2 v-1.5 h-2 Z M18 -3.6 h2 v-1.5 h-2 Z M13.5 3.6 h2 v1.5 h-2 Z M18 3.6 h2 v1.5 h-2 Z" fill="#3f7233" />
    <path d="M0 -0.6 L4 -0.6 L4 -1.5 L8 -1.5 L8 -2.5 L12 -2.5 L12 -3.6 L21 -3.6 L21 -3 L24 -3 L24 -2.2 L26.5 -2.2 L26.5 -1.4 L28 -1.4 L28 1.4 L26.5 1.4 L26.5 2.2 L24 2.2 L24 3 L21 3 L21 3.6 L12 3.6 L12 2.5 L8 2.5 L8 1.5 L4 1.5 L4 0.6 L0 0.6 Z" fill="#4c8438" />
    <circle cx="22.4" cy="-1.9" r="0.85" fill="#f7c243" />
    <circle cx="22.4" cy="1.9" r="0.85" fill="#f7c243" />
  </g>
  <g transform="translate(34 90) rotate(15) scale(2.95)">
    <path d="M13.5 -3.6 h2 v-1.5 h-2 Z M18 -3.6 h2 v-1.5 h-2 Z M13.5 3.6 h2 v1.5 h-2 Z M18 3.6 h2 v1.5 h-2 Z" fill="#3f7233" />
    <path d="M0 -0.6 L4 -0.6 L4 -1.5 L8 -1.5 L8 -2.5 L12 -2.5 L12 -3.6 L21 -3.6 L21 -3 L24 -3 L24 -2.2 L26.5 -2.2 L26.5 -1.4 L28 -1.4 L28 1.4 L26.5 1.4 L26.5 2.2 L24 2.2 L24 3 L21 3 L21 3.6 L12 3.6 L12 2.5 L8 2.5 L8 1.5 L4 1.5 L4 0.6 L0 0.6 Z" fill="#4c8438" />
    <circle cx="22.4" cy="-1.9" r="0.85" fill="#f7c243" />
    <circle cx="22.4" cy="1.9" r="0.85" fill="#f7c243" />
  </g>

  <g class="word" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     font-size="27" font-weight="700" letter-spacing="-0.6">
    <text x="140" y="58">Concurrent</text>
    <text x="140" y="88">Crocodiles</text>
  </g>
</svg>
